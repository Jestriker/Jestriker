name: Rebuild profile

on:
  schedule:
    - cron: '17 */3 * * *' # every 3 hours: clock, weather, day/night, activity
  push:
    branches: [main]
    paths: ['tools.json', 'scripts/**', 'README.md', '.github/workflows/build.yml']
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted] # guestbook
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: rebuild-profile
  cancel-in-progress: false

jobs:
  build:
    # only guestbook issues should trigger a rebuild
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'guestbook')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # optional fine-grained PAT (read-only) so the activity chart also sees private-repo commits
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: Commit if anything changed
        run: |
          git config user.name  "liamos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md data
          git diff --cached --quiet || git commit -m "chore: rebuild profile assets [skip ci]"
          git pull --rebase -X theirs origin main && git push
