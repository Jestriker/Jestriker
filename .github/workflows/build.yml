name: Rebuild profile

on:
  schedule:
    - cron: '17 3 * * *' # daily
  push:
    branches: [main]
    paths: ['tools.json', 'scripts/**', 'README.md', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git config user.name  "liamos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets README.md
          git diff --cached --quiet || git commit -m "chore: rebuild profile assets [skip ci]"
          git push
